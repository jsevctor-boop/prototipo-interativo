<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protótipo Interativo - Coleira 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            padding: 20px;
            text-align: center;
        }
        .container-3d {
            width: 90vw;
            max-width: 1000px;
            height: 70vh;
            background-color: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header>
        <h1>Protótipo: Coleira Inteligente</h1>
        <p>Arraste para girar o modelo. (O seu ficheiro 3D vai entrar aqui em breve)</p>
    </header>

    <!-- É nesta área que vamos colocar o código de interatividade (ex: Spline) -->
    <div class="container-3d">
        <p style="color: #888;">[ O modelo 3D aparecerá aqui ]</p>
    </div>
</body>
</html>
